name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: TypeScript, ESLint, Expo web build
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders so the client bundles without needing real
      # credentials. Every EXPO_PUBLIC_* var has a safe empty-string fallback
      # in src/lib/api.ts and src/lib/supabase.ts, so this is only here to
      # keep the export step's output deterministic — never put real keys here.
      EXPO_PUBLIC_BACKEND_URL: http://localhost:8000
      EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON: placeholder
      EXPO_PUBLIC_APP_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Expo web export (build smoke test)
        run: npx expo export --platform web
