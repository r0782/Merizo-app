name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-smoke-test:
    name: Ruff, import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Import smoke test
        # server.py reads SUPABASE_URL/SUPABASE_KEY/JWT_SECRET at import time
        # (os.environ[...], no default) but never makes a network call just
        # from importing — dummy values are enough to catch broken imports,
        # syntax errors, and missing modules (the class of bug this step
        # exists for) without touching a real Supabase project.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_KEY: placeholder
          JWT_SECRET: placeholder
          FRONTEND_URL: http://localhost:8081
          BACKEND_URL: http://localhost:8000
        run: python -c "import server; print('server.py imports cleanly')"

  integration-tests:
    name: API integration tests (live staging)
    runs-on: ubuntu-latest
    needs: lint-and-smoke-test
    # These tests (backend/tests/) hit a real deployed backend + demo account
    # over HTTP — never point them at production. Set the MERIZO_TEST_BACKEND_URL
    # repo/environment secret to a staging deployment backed by a separate
    # Supabase project to enable this job; until then it's skipped, not failed.
    if: ${{ vars.MERIZO_TEST_BACKEND_URL != '' || secrets.MERIZO_TEST_BACKEND_URL != '' }}
    env:
      EXPO_PUBLIC_BACKEND_URL: ${{ vars.MERIZO_TEST_BACKEND_URL || secrets.MERIZO_TEST_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest against staging
        run: pytest tests/ -v
